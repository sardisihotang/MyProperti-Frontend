<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyProperti</title>

    <link rel="icon" type="image/icon" href="image/favicon.jpg" />

    <!-- Code for font awesome cdn -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <!-- Code for font awesome cdn -->

    <!-- Code for font linking css file -->
    <link rel="stylesheet" type="text/css" href="styles.css" />
    <!-- Code for font linking css file -->

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body style="background-color: rgb(4, 130, 180);">
    <!-- Register Form -->
    <div
      class="register-container"
      style="
        max-width: 400px;
        margin: 50px auto;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        background-color: #fff;
      "
    >
      <form class="register-form" style="display: flex; flex-direction: column">
        <h2 style="text-align: center; margin-bottom: 20px">
          Daftar Akun Baru
        </h2>
        <div class="form-group" style="margin-bottom: 15px">
          <label for="username">Username:</label>
          <input
            type="text"
            id="username"
            placeholder="Masukkan username Anda"
            style="
              width: 100%;
              padding: 10px;
              border: 1px solid #ccc;
              border-radius: 5px;
              box-sizing: border-box;
            "
          />
        </div>
        <div class="form-group" style="margin-bottom: 15px">
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            placeholder="Masukkan email Anda"
            style="
              width: 100%;
              padding: 10px;
              border: 1px solid #ccc;
              border-radius: 5px;
              box-sizing: border-box;
            "
          />
        </div>
        <div class="form-group" style="margin-bottom: 15px">
          <label for="password" style="display: block; margin-bottom: 5px"
            >Password:</label
          >
          <input
            type="password"
            id="password"
            placeholder="Masukkan password Anda"
            style="
              width: 100%;
              padding: 10px;
              border: 1px solid #ccc;
              border-radius: 5px;
              box-sizing: border-box;
            "
          />
        </div>
        <button
          type="submit"
          class="btn"
          style="
            background-color: #007bff;
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
          "
        >
          Daftar
        </button>
        <button
          type="button"
          class="btn"
          onclick="window.location.href='index.html'"
          style="
            background-color: red;
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            margin-top: 20px;
          "
        >
          Kembali ke Beranda
        </button>
        <p class="link" style="text-align: center; margin-top: 10px">
          Sudah punya akun?
          <a href="login.html" style="color: #007bff; text-decoration: none"
            >Login Sekarang</a
          >
        </p>
      </form>
    </div>

    <!-- CSS Styles -->
    <style>
      .login-container,
      .register-container {
        max-width: 400px;
        margin: 50px auto;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        background-color: #fff;
      }

      .login-form,
      .register-form {
        display: flex;
        flex-direction: column;
      }

      .login-form h2,
      .register-form h2 {
        text-align: center;
        margin-bottom: 20px;
      }

      .form-group {
        margin-bottom: 15px;
      }

      .form-group label {
        display: block;
        margin-bottom: 5px;
      }

      .form-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
      }

      .btn {
        background-color: #007bff;
        color: #fff;
        padding: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
      }

      .btn:hover {
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      .link {
        text-align: center;
        margin-top: 10px;
      }

      .link a {
        color: #007bff;
        text-decoration: none;
      }

      .link a:hover {
        text-decoration: underline;
      }
    </style>
  </body>
</html>
